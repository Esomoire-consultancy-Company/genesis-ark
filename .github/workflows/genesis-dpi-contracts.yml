name: Genesis DPI Synthetic Node Contracts
on:
  push:
    paths:
      - "infrastructure/**"
      - "docs/architecture/GENESIS-DIGITAL-PHYSICAL-INFRASTRUCTURE-R0.1.md"
      - ".github/workflows/genesis-dpi-contracts.yml"
  pull_request:
    paths:
      - "infrastructure/**"
      - "docs/architecture/GENESIS-DIGITAL-PHYSICAL-INFRASTRUCTURE-R0.1.md"
      - ".github/workflows/genesis-dpi-contracts.yml"
permissions:
  contents: read
jobs:
  synthetic-passports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate synthetic node contracts
        run: |
          python -m compileall -q infrastructure
          python -m unittest discover -s infrastructure/tests -v
          python -m infrastructure.passport infrastructure/examples/synthetic-ark-001.json
