name: Smart Textiles R0.1

on:
  pull_request:
    paths:
      - "smart-textiles/**"
      - ".github/workflows/smart-textiles.yml"
  push:
    paths:
      - "smart-textiles/**"
      - ".github/workflows/smart-textiles.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: smart-textiles
        run: python -m pip install -e '.[test]'
      - name: Test
        working-directory: smart-textiles
        run: pytest -v
