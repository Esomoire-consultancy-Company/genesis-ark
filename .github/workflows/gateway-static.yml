name: Gateway static preview checks
on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-static.yml'
      - 'README.md'
  push:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-static.yml'
      - 'README.md'
permissions:
  contents: read
jobs:
  verify-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check gateway/portal.js
      - name: Static assets and guardrails
        run: python gateway/check.py
