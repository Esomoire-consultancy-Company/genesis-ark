name: Gateway static preview checks
on:
  pull_request:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-static.yml'
      - 'README.md'
  push:
    paths:
      - 'gateway/**'
      - '.github/workflows/gateway-static.yml'
      - 'README.md'
permissions: {}
jobs:
  verify-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check gateway/portal.js
      - name: Regression tests for the static validator
        run: python3 -m unittest discover -s gateway -p 'test_*.py'
      - name: Static assets and guardrails
        run: python3 gateway/check.py
