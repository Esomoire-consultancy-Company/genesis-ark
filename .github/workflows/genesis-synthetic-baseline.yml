name: Genesis synthetic baseline contract
on:
  pull_request:
    paths:
      - 'synthetic-baseline/**'
      - '.github/workflows/genesis-synthetic-baseline.yml'
  push:
    paths:
      - 'synthetic-baseline/**'
      - '.github/workflows/genesis-synthetic-baseline.yml'
permissions: {}
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify synthetic-only fixture and expected decisions
        run: python3 synthetic-baseline/verify.py
      - name: Run regression tests without network, licences or database
        run: python3 -m unittest discover -s synthetic-baseline -p 'test_*.py' -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Parse workbench JavaScript without running the server
        run: node --check synthetic-baseline/workbench/workbench.js
