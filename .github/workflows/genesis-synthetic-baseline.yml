name: Genesis synthetic baseline contract
on:
  pull_request:
    paths:
      - 'synthetic-baseline/**'
      - '.github/workflows/genesis-synthetic-baseline.yml'
  push:
    paths:
      - 'synthetic-baseline/**'
      - '.github/workflows/genesis-synthetic-baseline.yml'
permissions: {}
jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify fictional actors, licences and decisions (zero effects)
        run: python3 synthetic-baseline/verify.py
