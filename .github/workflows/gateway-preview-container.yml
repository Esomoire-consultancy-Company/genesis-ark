name: Genesis ARK Static Preview Container Review
on:
  pull_request:
    paths:
      - "gateway/**"
      - ".github/workflows/gateway-preview-container.yml"
  workflow_dispatch:
permissions: {}
jobs:
  inspect-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Existing static Gateway contract
        run: |
          node --check gateway/portal.js
          python3 gateway/check.py
      - name: Read-only preview isolation and negative tests
        run: python3 -m unittest discover -s gateway -p "test_*.py"
      - name: Build isolated public-preview image; no registry push
        run: docker build --file gateway/Dockerfile.preview --tag genesis-ark-static-preview:review gateway
      - name: Ensure container refuses start without explicit admission
        shell: bash
        run: |
          set +e
          docker run --rm --network none genesis-ark-static-preview:review >preview-startup.log 2>&1
          exit_status=$?
          set -e
          if [ "$exit_status" -ne 78 ]; then
            cat preview-startup.log
            echo "Expected fail-closed exit 78, saw $exit_status"
            exit 1
          fi
          grep -q "HOLD:" preview-startup.log
          echo "PASS: public preview image refuses admission by default"
