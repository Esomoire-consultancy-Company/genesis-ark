name: Actor Box and CloudBrowser CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/actor-box-foundation-v1

permissions:
  contents: read

concurrency:
  group: actor-box-cloudbrowser-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install packages and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install 'jsonschema==4.26.0' 'PyYAML==6.0.3'
          python -m pip install -e './services/warden[postgres,test]'
          python -m pip install -e './services/cloudbrowser[production,test]'

      - name: Install managed Chromium
        run: python -m playwright install --with-deps chromium

      - name: Resolve managed Chromium executable
        shell: bash
        run: |
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          echo "CLOUDBROWSER_TEST_CHROMIUM_EXECUTABLE=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          echo "Using managed Chromium: $CHROMIUM_PATH"

      - name: Validate contracts and migrations
        run: |
          python scripts/validate_actor_box_contracts.py
          python scripts/validate_cloudbrowser_contracts.py
          python scripts/validate_authoritative_runtime.py

      - name: Test Warden
        env:
          PYTHONPATH: services/warden/src
        run: pytest -q services/warden/tests

      - name: Test CloudBrowser API
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_api.py

      - name: Test CloudBrowser policy
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_policy.py

      - name: Test CloudBrowser PostgreSQL repository
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_postgres_repository.py

      - name: Test CloudBrowser idempotency
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_idempotency.py

      - name: Test CloudBrowser approval replay
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_approval_replay.py

      - name: Test Chromium cookie isolation
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_playwright_executor.py::test_non_persistent_contexts_do_not_share_cookies

      - name: Test Chromium domain blocking
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_playwright_executor.py::test_context_route_blocks_non_allowlisted_network

      - name: Test Chromium pause teardown
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_playwright_executor.py::test_pause_closes_runtime_context

      - name: Test Chromium quarantine permissions
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests/test_playwright_executor.py::test_quarantine_directories_are_owner_only

      - name: Build distributable wheels
        if: success()
        run: |
          python -m build services/warden
          python -m build services/cloudbrowser
