name: Genesis Actor Box Runtime CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: genesis-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install packages and test dependencies
        run: |
          python -m pip install --upgrade pip build
          python -m pip install 'jsonschema==4.26.0' 'PyYAML==6.0.3'
          python -m pip install -e './services/warden[postgres,test]'
          python -m pip install -e './services/cloudbrowser[production,test]'
          python -m pip install -e './services/runtime[postgres,test]'

      - name: Install managed Chromium
        run: python -m playwright install --with-deps chromium

      - name: Resolve managed Chromium executable
        shell: bash
        run: |
          CHROMIUM_PATH="$(python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(playwright.chromium.executable_path)
          PY
          )"
          test -x "$CHROMIUM_PATH"
          echo "CLOUDBROWSER_TEST_CHROMIUM_EXECUTABLE=$CHROMIUM_PATH" >> "$GITHUB_ENV"
          echo "Using managed Chromium: $CHROMIUM_PATH"

      - name: Validate contracts and migrations
        run: |
          python scripts/validate_actor_box_contracts.py
          python scripts/validate_cloudbrowser_contracts.py
          python scripts/validate_authoritative_runtime.py
          python scripts/validate_runtime_platform.py

      - name: Test Warden
        env:
          PYTHONPATH: services/warden/src
        run: pytest -q services/warden/tests

      - name: Test CloudBrowser
        if: always()
        env:
          PYTHONPATH: services/cloudbrowser/src:services/warden/src
        run: pytest -q services/cloudbrowser/tests

      - name: Test Runtime Manager
        if: always()
        env:
          PYTHONPATH: services/runtime/src
        run: pytest -q services/runtime/tests

      - name: Build distributable wheels
        if: success()
        run: |
          python -m build services/warden
          python -m build services/cloudbrowser
          python -m build services/runtime
