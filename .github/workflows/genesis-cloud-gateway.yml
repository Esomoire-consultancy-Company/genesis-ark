name: Genesis ARK Cloud Gateway R0.1
on:
  push:
    paths:
      - 'cloud-gateway/**'
      - '.github/workflows/genesis-cloud-gateway.yml'
  pull_request:
    paths:
      - 'cloud-gateway/**'
      - '.github/workflows/genesis-cloud-gateway.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -e './cloud-gateway[test]'
      - name: Gateway contract tests
        working-directory: cloud-gateway
        run: python -m pytest -q
