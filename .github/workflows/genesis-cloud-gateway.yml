name: Genesis ARK Cloud Gateway R0.1
on:
  push:
    paths:
      - 'cloud-gateway/**'
      - '.github/workflows/genesis-cloud-gateway.yml'
  pull_request:
    paths:
      - 'cloud-gateway/**'
      - '.github/workflows/genesis-cloud-gateway.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install as Railway would
        working-directory: cloud-gateway
        run: |
          python -m pip install -r requirements.txt
          python -m pip install '.[test]'
          python -m uvicorn --version
      - name: Gateway contract tests
        working-directory: cloud-gateway
        run: python -m pytest -q

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: genesis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d genesis_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway and integration dependencies
        working-directory: cloud-gateway
        run: |
          python -m pip install -r requirements.txt
          python -m pip install '.[test]'
      - name: Verify PostgreSQL migration, permissions and evidence chain
        working-directory: cloud-gateway
        env:
          GENESIS_TEST_ADMIN_DATABASE_URL: postgresql://postgres:ci-only-postgres-password@127.0.0.1:5432/genesis_ci
        run: python -m pytest -q tests/test_postgres_integration.py
