name: Source integrity and UTF-8 inventory
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test encoding verification
        run: python3 -m unittest discover -s tests -p test_source_integrity.py -v
      - name: Check tracked source and generate manifest
        run: python3 scripts/source_integrity.py --output .source-integrity/manifest.json
      - name: Upload inspectable source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genesis-source-integrity-manifest
          path: .source-integrity/manifest.json
          if-no-files-found: ignore
