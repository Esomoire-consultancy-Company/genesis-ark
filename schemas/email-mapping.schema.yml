# Email Mapping Schema
# Validates registry/aliases/email-mapping.yml

type: map
mapping:
  mappings:
    type: seq
    required: true
    sequence:
      - type: map
        mapping:
          id:
            type: str
            required: true
          generated:
            type: str
            required: true
          alias:
            type: str
            required: true
          display_name:
            type: str
            required: true
          target:
            type: str
            required: true
          tristar_key:
            type: str
            required: true
          status:
            type: str
            required: true
            enum: [active, suspended, deregistered]
