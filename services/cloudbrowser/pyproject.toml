[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-cloudbrowser-service"
version = "0.1.0"
description = "Governed CloudBrowser session broker for Genesis Actor Boxes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
cloudbrowser-service = "cloudbrowser_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "../warden/src"]
testpaths = ["tests"]
addopts = "-q"
