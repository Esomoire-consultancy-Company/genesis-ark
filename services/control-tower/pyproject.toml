[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-control-tower"
version = "0.1.0"
description = "Governed fleet operations, incident management and command dispatch for Genesis runtimes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4"]
test = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
genesis-control-tower = "control_tower_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
