[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-warden-service"
version = "0.1.0"
description = "Deny-by-default Warden control plane for Genesis Actor Boxes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "pydantic>=2.13,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
postgres = [
  "psycopg[binary,pool]==3.3.4",
]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[project.scripts]
warden-service = "warden_service.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
